<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>J&R</title>

    <meta name="description" content="Catálogo online de productos con filtros y ofertas">

    <link rel="stylesheet" href="estilos.css">

    <script src="datos.js"></script>
    <script src="catalogo.js" defer></script>

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <meta name="theme-color" content="#241a13">
    <link rel="icon" href="favicon.ico">
</head>

<body>

    <header>

        <img
            src="logo.png"
            alt="Cueros J&R"
            class="logo"
        >

        <p>
            Encuentra la mejor calidad y precio en cueros
        </p>

    </header>

        <div class="barra">

        <img
            src="logo.png"
            alt="Logo"
            class="logo-barra"
        >

        <input
            id="buscar"
            placeholder="Buscar producto..."
        >

        <button id="btnOfertas">
            Ofertas
        </button>

        <select id="ordenPrecio">
            <option value="">Ordenar precio</option>
            <option value="asc">Menor a Mayor</option>
            <option value="desc">Mayor a Menor</option>
        </select>

        <select id="categoria">
            <option value="">Todas las categorías</option>
        </select>

        <div class="barra-redes">

            <a
                href="https://www.facebook.com/share/1BF8ZGg73T/"
                target="_blank"
                class="red-social btn-facebook"
            >
                <i class="fa-brands fa-facebook"></i>
                Facebook
            </a>

            <a
                href="https://wa.me/56974485301?text=Hola,%20vi%20su%20catálogo%20web%20y%20me%20interesa%20un%20producto."
                target="_blank"
                class="red-social btn-whatsapp"
            >
                <i class="fa-brands fa-whatsapp"></i>
                WhatsApp
            </a>

            <a
                href="#"
                id="btnMapa"
                class="red-social btn-mapa"
            >
                <i class="fa-solid fa-location-dot"></i>
                Ubicación
            </a>

        </div>

    </div>

    <div id="catalogo"></div>

    <!-- Modal de imágenes -->

    <div id="modal" class="modal">

    <div class="modal-content">

        <span class="close">&times;</span>

        <img id="modalImg" src="" alt="">

        <!-- 👇 ESTE ES EL BLOQUE QUE TE FALTABA -->
        <div class="puntos-modal">
            <span class="punto-modal activo"></span>
            <span class="punto-modal"></span>
            <span class="punto-modal"></span>
        </div>

        <div class="controls">
            <button id="prev">Anterior</button>
            <button id="next">Siguiente</button>
        </div>

    </div>
</div>

    <!-- Modal del mapa -->

    <div id="modalMapa" class="modal">

        <div class="modal-content mapa-content">

            <span
                id="cerrarMapa"
                class="close"
            >
                &times;
            </span>

            <iframe
                src="https://maps.google.com/maps?q=Avenida%20Circunvalacion%202016%20Ancud%20Chile&t=k&z=18&output=embed"
                width="100%"
                height="600"
                style="border:0;border-radius:10px;"
                loading="lazy">
            </iframe>

        </div>

    </div>

</body>

</html>
